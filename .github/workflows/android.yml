name: Build Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allow triggering manually from the Actions tab
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source code ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java ───────────────────────────────────────────────────────────────
      # sdkmanager v16+ (bundled with setup-android@v3) requires JDK 17 or later.
      # Haxe/Lime itself works fine with 17 as well.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── 3. Android SDK ────────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform & build tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;21.4.7075529"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      # ── 4. Haxe ───────────────────────────────────────────────────────────────
      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      # ── 5. Haxelib dependencies ───────────────────────────────────────────────
      - name: Install haxelibs
        run: |
          haxelib setup ~/haxelib
          haxelib install lime         --quiet
          haxelib install openfl        --quiet
          haxelib install flixel        --quiet
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui     --quiet
          haxelib install hscript       --quiet
          haxelib install newgrounds    --quiet
          haxelib install polymod       --quiet

      # ── 6. Configure Lime with the Android SDK / NDK paths ───────────────────
      - name: Configure Lime for Android
        run: |
          haxelib run lime config ANDROID_SDK      $ANDROID_SDK_ROOT
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_SDK_ROOT/ndk/21.4.7075529
          haxelib run lime config JAVA_HOME        $JAVA_HOME

      # ── 7. Build ──────────────────────────────────────────────────────────────
      - name: Build APK (debug)
        run: haxelib run lime build android -debug

      # ── 8. Upload APK artifact ────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VsWhitty-android-debug
          path: export/debug/android/bin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7